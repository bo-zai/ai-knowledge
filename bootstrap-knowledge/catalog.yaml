version: 1

retrieval_order:
  capability_context:
    - CAP
    - TERM
    - FLOW
    - MOD
    - CON
    - VER
    - OPEN

sdd_stage_mapping:
  requirement_clarification:
    include_types: [TERM, CAP, OPEN]
  requirement_specification:
    include_types: [CAP, FLOW, CON, VER, OPEN]
  design_planning:
    include_types: [FLOW, CON, MOD, OPEN]
  implementation_planning:
    include_types: [MOD, CON, VER, FLOW]
  coding:
    include_types: [MOD, CON, VER]
  review:
    include_types: [CON, MOD, VER, OPEN]
  validation:
    include_types: [VER, CON, FLOW]

capabilities:
  CAP-DB-KNOWLEDGE-GENERATION:
    view: views/capabilities/CAP-DB-KNOWLEDGE-GENERATION.md
    objects:
      - CAP-DB-KNOWLEDGE-GENERATION
      - FLOW-DB-KNOWLEDGE-GENERATION
      - MOD-SRC-MYBATIS
      - CON-SQLPART
      - VER-DB-KNOWLEDGE-GENERATION
      - OPEN-N-DB
      - OPEN-N-API

objects:
  CAP-DB-KNOWLEDGE-GENERATION:
    type: CAP
    path: objects/capabilities/CAP-DB-KNOWLEDGE-GENERATION.yaml
  FLOW-DB-KNOWLEDGE-GENERATION:
    type: FLOW
    path: objects/flows/FLOW-DB-KNOWLEDGE-GENERATION.yaml
  MOD-SRC-MYBATIS:
    type: MOD
    path: objects/modules/MOD-SRC-MYBATIS.yaml
  CON-SQLPART:
    type: CON
    path: objects/contracts/CON-SQLPART.yaml
  VER-DB-KNOWLEDGE-GENERATION:
    type: VER
    path: objects/validation/VER-DB-KNOWLEDGE-GENERATION.yaml
  OPEN-N-DB:
    type: OPEN
    path: objects/open/OPEN-N-DB.yaml
  OPEN-N-API:
    type: OPEN
    path: objects/open/OPEN-N-API.yaml