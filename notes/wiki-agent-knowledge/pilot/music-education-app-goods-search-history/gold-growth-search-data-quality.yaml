case_id: CASE-MUSIC-APP-GROWTH-SEARCH-DATA-QUALITY
requirement_file: request-growth-search-data-quality.md
risk_level: medium

gold:
  business_intent:
    - "只统计真实主动搜索，减少脏搜索词对增长分析的干扰"
    - "不要把翻页、分类切换、列表进入、普通刷新当成新的搜索动作"
  must_recognize:
    - "当前后端搜索历史写入发生在商品列表查询主流程内"
    - "当前商品搜索与搜索历史写入并不是同一个条件"
    - "如果要区分主动搜索和普通浏览，可能需要调用方明确传递语义，或调整现有请求语义"
    - "商品列表正常返回不能被这次改动破坏"
  boundary_expectations:
    in_scope_backend:
      - "goods list contract"
      - "goods search service logic"
      - "search history write path"
    possible_external_dependency:
      - "前端或调用方如何表达‘主动搜索’与‘普通浏览’"
  likely_change_surface:
    - CON-GOODS-LIST
    - MOD-GOODS-SERVICE-QUERY-PAGE
    - MOD-SEARCH-HISTORY-SERVICE-SAVE
  should_not_focus_on:
    - "热词展示 UI"
    - "商品详情"
    - "推荐商品"
    - "兑换流程"
  must_ask:
    - "客户端目前如何区分主动搜索、翻页、分类切换和普通进入列表"
    - "同一轮搜索翻页时，后端是否仍会收到 keyword"
    - "是否允许通过新增请求语义来表达‘这次是主动搜索’"
  validation_expectations:
    - "主动搜索产生一条有效搜索记录"
    - "同一轮翻页不重复新增记录"
    - "仅切换分类或进入列表不新增记录"
    - "无关键词时列表浏览保持正常"
  veto_conditions:
    - "把需求理解成热词展示或搜索历史页面需求"
    - "忽略调用方/请求语义边界，直接假设后端能无歧义地区分所有用户动作"
    - "遗漏搜索历史写入路径"
    - "声称改动只在 controller 层完成"
